<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <!-- The tab title never changes. It must never leak the drawn song. -->
  <title>Hitster</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="centred">
  <main class="panel">

    <section id="signed-out">
      <h1>Hitster</h1>
      <p class="lede">Connect your Spotify Premium account to start a game.</p>
      <button id="login" class="button" type="button">Log in with Spotify</button>
    </section>

    <section id="start" class="hidden">
      <h1>Hitster</h1>
      <p class="lede">Turn the volume up before you start.</p>
      <!-- This tap is load-bearing: it is the user gesture that buys permission
           to play audio for the rest of the session. -->
      <button id="begin" class="button" type="button" disabled>Preparing…</button>
      <button id="logout" class="button secondary" type="button">Log out</button>
    </section>

    <section id="table" class="hidden">
      <div id="card" class="card">
        <div class="card-inner">
          <div class="card-face card-back">
            <!-- The record stops turning when playback is paused, so the card
                 doubles as the playing indicator. -->
            <div class="vinyl" aria-hidden="true"><span class="vinyl-label"></span></div>
            <span class="card-mark" aria-hidden="true">?</span>
          </div>
          <!-- Left empty until Reveal. The details are injected at that moment
               and cleared on the next draw, so there is never a spoiler sitting
               in the DOM waiting to be found. -->
          <div class="card-face card-front" aria-live="polite">
            <p id="card-artist" class="card-artist"></p>
            <h2 id="card-title" class="card-title"></h2>
            <p id="card-year" class="card-year"></p>
          </div>
        </div>
      </div>

      <button id="action" class="button" type="button">Draw</button>
      <button id="toggle" class="button secondary hidden" type="button">Pause</button>
    </section>

    <p id="notice" class="status hidden"></p>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
