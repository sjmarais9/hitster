<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <!-- The tab title never changes. It must never leak the drawn song. -->
  <title>Hitster</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="centred">
  <main class="panel">

    <section id="signed-out">
      <h1>Hitster</h1>
      <p class="lede">Connect your Spotify Premium account to start a game.</p>
      <button id="login" class="button" type="button">Log in with Spotify</button>
    </section>

    <section id="start" class="hidden">
      <h1>Hitster</h1>
      <p class="lede">Turn the volume up before you start.</p>
      <!-- This tap is load-bearing: it is the user gesture that buys permission
           to play audio for the rest of the session. -->
      <button id="begin" class="button" type="button" disabled>Preparing…</button>
      <button id="logout" class="button secondary" type="button">Log out</button>
    </section>

    <section id="table" class="hidden">
      <div id="card" class="card">
        <div class="card-inner">
          <div class="card-face card-back">
            <!-- The record stops turning when playback is paused, so the card
                 doubles as the playing indicator. -->
            <div class="vinyl" aria-hidden="true"><span class="vinyl-label"></span></div>
            <span class="card-mark" aria-hidden="true">?</span>
          </div>
          <!-- Left empty until Reveal. The details are injected at that moment
               and cleared on the next draw, so there is never a spoiler sitting
               in the DOM waiting to be found. -->
          <div class="card-face card-front" aria-live="polite">
            <p id="card-artist" class="card-artist"></p>
            <h2 id="card-title" class="card-title"></h2>
            <p id="card-year" class="card-year"></p>
          </div>
        </div>
      </div>

      <!-- Transport sits above the primary action so the two are not confused
           for one another in a dim room. -->
      <div class="controls">
        <button id="replay" class="icon-button" type="button" aria-label="Play from the start">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/>
          </svg>
        </button>
        <button id="toggle" class="icon-button primary" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
          </svg>
        </button>
      </div>

      <button id="action" class="button" type="button">Reveal</button>
    </section>

    <p id="notice" class="status hidden"></p>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
