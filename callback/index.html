<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Signing in</title>
  <link rel="stylesheet" href="../css/style.css?v=af25f86d">
</head>
<body class="centred">
  <main class="panel">
    <p id="status" class="status">Finishing sign-in…</p>
    <a id="retry" class="button hidden" href="../">Back to the app</a>
  </main>

  <script type="module">
    import { completeLogin, appUrl } from '../src/auth.js?v=af25f86d';

    const status = document.getElementById('status');
    const retry = document.getElementById('retry');

    try {
      await completeLogin();
      // Replace, not assign: the code is single-use, so this URL must not be
      // reachable with the back button.
      location.replace(appUrl());
    } catch (err) {
      status.textContent = err.message;
      status.classList.add('error');
      retry.classList.remove('hidden');
    }
  </script>
</body>
</html>
